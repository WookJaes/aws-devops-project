name: CI/CD Pipeline

# master 브랜치에 코드가 푸시될 때 워크플로우 실행
on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Github 레포지토리의 최신 소스 코드를 가져옴
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Java 17(Amazon Corretto) 환경 세팅
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      # 3. Gradle 빌드 스크립트에 실행 권한을 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 코드를 빌드하고 테스트를 수행하여 실행 가능한 Jar 파일 생성
      - name: Build and test with Gradle
        env:
          SPRING_PROFILES_ACTIVE: local
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          CLOUD_AWS_S3_BUCKET: member-wj-files
        run: ./gradlew clean test bootJar

      # 5. 빌드한 이미지를 올리기 위해 Docker Hub에 로그인
      - name: Login to Docker Hub
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKER_IMAGE%%/*}" --password-stdin

      # 6. ARM64 빌드를 위해 QEMU를 세팅
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. 다양한 아키텍처(ARM 등) 빌드를 지원하는 Docker Buildx 세팅
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Dockerfile을 기반으로 이미지를 빌드하고 Docker Hub에 푸시
      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/arm64 -t ${{ vars.DOCKER_IMAGE }}:latest --push .

      # 9. EC2에 SSH로 접속하여 최신 이미지를 다운로드하고 컨테이너 재실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ vars.DOCKER_IMAGE }}:latest
            docker stop ${{ vars.CONTAINER_NAME }} || true
            docker rm ${{ vars.CONTAINER_NAME }} || true
            docker run -d \
              --name ${{ vars.CONTAINER_NAME }} \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e AWS_REGION=${{ vars.AWS_REGION }} \
              -e AWS_DEFAULT_REGION=${{ vars.AWS_REGION }} \
              -e SPRING_CLOUD_AWS_PARAMETERSTORE_REGION=${{ vars.AWS_REGION }} \
              ${{ vars.DOCKER_IMAGE }}:latest