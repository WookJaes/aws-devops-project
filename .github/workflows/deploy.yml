name: CI/CD Pipeline

# master 브랜치에 코드가 푸시될 때 워크플로우 실행
on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    # GitHub Actions 실행 환경을 Ubuntu 최신 버전으로 지정
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 레포지토리의 최신 소스 코드 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Java 17(Amazon Corretto) 실행 환경 세팅
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      # 3. Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 애플리케이션 빌드 및 테스트를 수행해 Jar 생성
      - name: Build and test with Gradle
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_CLOUD_AWS_REGION_STATIC: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          SPRING_CLOUD_AWS_S3_BUCKET: member-wj-files
        run: ./gradlew clean test bootJar

      # 5. Docker Hub에 로그인하여 이미지 푸시 준비
      - name: Login to Docker Hub
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKER_IMAGE%%/*}" --password-stdin

      # 6. ARM64 이미지 빌드를 위한 QEMU 에뮬레이터 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. 멀티 아키텍처 Docker 이미지 빌드를 위한 Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Docker 이미지를 빌드하고 Docker Hub에 latest와 커밋 해시 태그로 함께 푸시
      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ vars.DOCKER_IMAGE }}:latest \
            -t ${{ vars.DOCKER_IMAGE }}:${{ github.sha }} \
            --push .

      # 9. AWS CLI 사용을 위해 GitHub Secrets의 AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 10. Auto Scaling Group의 인스턴스 새로고침을 시작해 새 이미지 반영
      - name: Start ASG instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ vars.ASG_NAME }}